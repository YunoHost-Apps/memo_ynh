#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "memo"
name = "Memo"
description.en = "Collaborative sticky-note boards in real time, stored in one SQLite file"
description.fr = "Tableaux de post-it collaboratifs en temps réel, stockés dans un seul fichier SQLite"

# <upstream tag>~ynh<packaging revision>
version = "0.9.11~ynh1"

maintainers = ["mrflos"]

[upstream]
license = "AGPL-3.0-only"
website = "https://codeberg.org/mrflos/memo"
code = "https://codeberg.org/mrflos/memo"
admindoc = "https://codeberg.org/mrflos/memo#readme"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"

# Upstream compiles with bun, which ships no 32 bit runtime, so armhf and i386
# boards are out. Each release carries three binaries; which one lands here is
# decided at install time, see memo_setup_binary in scripts/_common.sh.
architectures = ["amd64", "arm64"]
multi_instance = true

# People sign in with their YunoHost account, and the portal signs them in
# without a second login form.
ldap = false
sso = true

# The binary is 90 MB of the install dir on its own. The rest is the boards,
# which live elsewhere anyway. Nothing is compiled at install time: the build
# figure is what unpacking and checksumming one download needs.
disk = "250M"
ram.build = "100M"
ram.runtime = "200M"

[install]

    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/memo"

    [install.init_main_permission]
    type = "group"
    default = "all_users"

    [install.admin]
    type = "user"
    help.en = "This account gets memo's admin page, which lists and deletes boards. The role is granted once, while memo has no admin at all: changing this setting later does nothing, revoke or grant from the admin page instead."
    help.fr = "Ce compte obtient la page d'administration de memo, qui liste et supprime les tableaux. Le rôle n'est accordé qu'une fois, tant que memo n'a aucun admin : modifier ce réglage plus tard ne fait rien, révoquez ou accordez depuis la page d'administration."

    [install.language]
    ask.en = "Choose the application language"
    ask.fr = "Choisissez la langue de l'application"
    type = "select"
    choices = ["en", "fr", "es", "ru"]
    default = "en"

[resources]

    [resources.sources]

    # One compiled binary is the whole app: the bun runtime, the server, and
    # the pages, fonts and background images packed inside it. No checkout, no
    # node_modules, no network beyond this download. Re-pin the three assets of
    # a release with dev/update-source.sh.
    #
    # Neither source is prefetched. Only one of the two is ever installed and
    # each is 90 MB, and above all the core refuses to prefetch a source that
    # has no asset for the machine's own architecture, which the amd64-only
    # block below has not. ynh_setup_source downloads the one it is asked for.

    # What runs anywhere: the baseline build on amd64, which asks nothing of
    # the processor beyond plain x86-64, and the only build there is on arm64.
    [resources.sources.main]
    amd64.url = "https://codeberg.org/mrflos/memo/releases/download/v0.9.11/memo-0.9.11-linux-amd64-baseline"
    amd64.sha256 = "2ddce8eaf2c55e4b3873b6c90f9bfae4906df7cc3103578e39ef330e42b037b6"
    arm64.url = "https://codeberg.org/mrflos/memo/releases/download/v0.9.11/memo-0.9.11-linux-arm64"
    arm64.sha256 = "cb13a66c7f46f3780ec5e292949743efc84260f956f77f1d6f22c66d036c0a0a"
    extract = false
    rename = "memo"
    prefetch = false

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.upstream = "https://codeberg.org/mrflos/memo"
    autoupdate.asset.amd64 = "^memo-.*-linux-amd64-baseline$"
    autoupdate.asset.arm64 = "^memo-.*-linux-arm64$"

    # The faster amd64 build, which needs AVX2 and dies with SIGILL without it.
    # Installed in place of the baseline one when the processor has the flag,
    # so no arm64 asset belongs here.
    [resources.sources.amd64_avx2]
    amd64.url = "https://codeberg.org/mrflos/memo/releases/download/v0.9.11/memo-0.9.11-linux-amd64"
    amd64.sha256 = "f57521a1be878a717ce3829272f30c95727d5ed78ab8bc75155c2ba00090c1d8"
    extract = false
    rename = "memo"
    prefetch = false

    autoupdate.strategy = "latest_forgejo_release"
    autoupdate.upstream = "https://codeberg.org/mrflos/memo"
    autoupdate.asset.amd64 = "^memo-.*-linux-amd64$"

    [resources.system_user]

    [resources.install_dir]

    # The SQLite file lives here rather than in the install dir, so that
    # removing the app without --purge leaves the boards behind and an upgrade
    # never has to tiptoe around them.
    [resources.data_dir]

    [resources.permissions]
    main.url = "/"
    # What makes the SSO worth having: nginx turns the header SSOwat sets into
    # the one memo reads, and nobody sees a second login form.
    main.auth_header = true

    [resources.ports]
