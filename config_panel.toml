#:schema https://github.com/YunoHost/apps/raw/main/schemas/config_panel.v1.schema.json

version = "1.0"

[main]
name.en = "Configuration"
name.fr = "Configuration"
services = ["__APP__"]

    [main.appearance]
    name.en = "Appearance"
    name.fr = "Apparence"

        [main.appearance.language]
        ask.en = "Default interface language"
        ask.fr = "Langue par défaut de l'interface"
        help.en = "What visitors see until they pick a language of their own."
        help.fr = "Ce que voient les visiteurs tant qu'ils n'ont pas choisi la leur."
        type = "select"
        choices = ["en", "fr", "es", "ru"]
        bind = "DEFAULT_LANG:__INSTALL_DIR__/.env"

        [main.appearance.logo_url]
        ask.en = "Logo URL"
        ask.fr = "URL du logo"
        help.en = "Replaces the memo wordmark at the top of every page. Leave empty to keep it."
        help.fr = "Remplace le logo memo en haut de chaque page. Laissez vide pour le garder."
        type = "string"
        optional = true
        bind = "LOGO_URL:__INSTALL_DIR__/.env"

        [main.appearance.favicon_url]
        ask.en = "Favicon URL"
        ask.fr = "URL du favicon"
        type = "string"
        optional = true
        bind = "FAVICON_URL:__INSTALL_DIR__/.env"

    [main.boards]
    name.en = "Boards"
    name.fr = "Tableaux"

        [main.boards.allow_anonymous_boards]
        ask.en = "Let visitors create boards"
        ask.fr = "Laisser les visiteurs créer des tableaux"
        help.en = "Only matters if the permission lets visitors in: opening and writing on an existing board never needs an account, creating one does unless this is on."
        help.fr = "N'a d'effet que si la permission accepte les visiteurs : ouvrir un tableau et y écrire ne demande jamais de compte, en créer un si, sauf si ceci est activé."
        type = "boolean"
        yes = "1"
        no = "0"
        default = "0"
        bind = "ALLOW_ANONYMOUS_BOARDS:__INSTALL_DIR__/.env"
