#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

# memo's own sign-out has nothing to drop. Under AUTH=proxy the portal cookie
# is the whole session, so memo would clear nothing and send the browser back
# to a page SSOwat still authenticates, signing the person straight back in.
# Hand them to the portal's own logout instead, which deletes the session
# server side; referer_redirect returns them to the page they left, where the
# SSO now asks for a login. Relative on purpose, so this stays on whichever
# host the browser is on: the portal session is bound to that host.
location = __PATH__/logout {
  return 303 /yunohost/portalapi/logout?referer_redirect;
}

# The mirror of the sign out, and it only comes up when the permission lets
# visitors in: memo's "Sign in" points at /login, which under AUTH=proxy has no
# form to show and would bounce straight back to the home page. Send it to the
# portal. The ?r= is where the portal returns the person once they are in,
# base64 encoded, the same shape SSOwat builds when it redirects an anonymous
# visitor. Absolute, and to __DOMAIN__ rather than to whatever host the browser
# used, because that is the host memo is served from and the one its ORIGIN
# check accepts.
location = __PATH__/login {
  return 303 https://__DOMAIN__/yunohost/sso/?r=__PORTAL_RETURN__;
}

location __PATH__/ {

  # No trailing URI on purpose: memo is told its own prefix through BASEURL and
  # routes the full path itself, so nginx passes it through unchanged.
  proxy_pass http://127.0.0.1:__PORT__;
  include    proxy_params_with_auth;

  proxy_read_timeout 1d;
  proxy_send_timeout 1d;

  # Card images and imported decks come in through here.
  client_max_body_size 16m;

  proxy_set_header Remote-Groups "";
}
