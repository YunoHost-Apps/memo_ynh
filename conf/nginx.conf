#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;
location __PATH__/ {

  # No trailing URI on purpose: memo is told its own prefix through BASEURL and
  # routes the full path itself, so nginx passes it through unchanged.
  proxy_pass http://127.0.0.1:__PORT__;
  proxy_http_version 1.1;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # The board's socket at /ws. Forwarding the client's own Connection header
  # keeps a plain request plain and lets an upgrade through, with no http-level
  # map to declare. A board's socket is idle whenever nobody is typing, and the
  # default minute would drop it: boards go quiet and stop updating.
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $http_connection;
  proxy_read_timeout 1d;
  proxy_send_timeout 1d;

  # Card images and imported decks come in through here.
  client_max_body_size 16m;

  # Who the visitor is. SSOwat has already thrown away any ynh_* header the
  # client sent and set its own from the portal cookie, so this is the one
  # place the names memo reads are decided. proxy_set_header overwrites, so a
  # client sending Remote-User gets it replaced, and Remote-Groups is blanked
  # outright because YunoHost group membership is not forwarded.
  proxy_set_header Remote-User $http_ynh_user;
  proxy_set_header Remote-Name $http_ynh_user_fullname;
  proxy_set_header Remote-Groups "";

  # The YunoHost portal button. Drop these two lines if you would rather have
  # gzip back and no overlay on the board.
  include conf.d/yunohost_panel.conf.inc;
  more_clear_input_headers 'Accept-Encoding';
}
