#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/ {

  # No trailing URI on purpose: memo is told its own prefix through BASEURL and
  # routes the full path itself, so nginx passes it through unchanged. That
  # includes /login and /logout, which memo answers with a redirect to the
  # portal, built from PROXY_LOGIN_URL and PROXY_LOGOUT_URL in the .env.
  proxy_pass http://127.0.0.1:__PORT__;
  include    proxy_params_with_auth;

  proxy_read_timeout 1d;
  proxy_send_timeout 1d;

  # Card images, board pictures and imported decks come in through here.
  client_max_body_size 16m;

  # memo reads groups from this header and SSOwat sends none, so blank it: a
  # client could otherwise claim a group membership for itself.
  proxy_set_header Remote-Groups "";
}
